name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned CPU development environment
        run: python -m pip install -r requirements-dev.lock
      - name: Validate Bash entrypoints
        run: bash -n experiments/silenttwin/*.sh
      - name: Run offline tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SILENTTWIN_ALLOW_NETWORK_MODEL: "0"
        run: pytest -q
